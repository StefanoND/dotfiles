# -----------------------------------------------------
# Keyboard Layout
# Mouse Settings
# https://wiki.hyprland.org/Configuring/Variables/#input
# -----------------------------------------------------
input {
    kb_layout = pt
    kb_variant =
    kb_model = pc105
    kb_options =
    numlock_by_default = false
    mouse_refocus=false
    repeat_rate = 60
    repeat_delay = 300

    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    accel_profile = flat
}
