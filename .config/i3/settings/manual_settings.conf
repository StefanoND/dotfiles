# kill focused window
bindsym $mod+q kill
bindsym $mod+t exec dolphin
bindsym $mod+space focus mode_toggle
bindsym $mod+d exec --no-startup-id rofi -show drun
bindsym $mod+Shift+p split toggle

# launch categorized menu
bindsym $mod+z exec --no-startup-id morc_menu

# Set volume
bindsym XF86AudioRaiseVolume exec --no-startup-id pactl set-sink-volume 0 +5%
bindsym XF86AudioLowerVolume exec --no-startup-id pactl set-sink-volume 0 -5%
bindsym XF86AudioMute exec --no-startup-id pactl set-sink-mute 0 toggle

# Media player controls
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl play-pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous

# Screen brightness controls
bindsym XF86MonBrightnessUp exec xbacklight -inc 10
bindsym XF86MonBrightnessDown exec xbacklight -dec 10

# Start Applications
bindsym $mod+Ctrl+b exec terminal -e 'bmenu'
bindsym $mod+F1 exec brave
bindsym $mod+F3 exec dolphin
bindsym $mod+F4 exec kate
bindsym $mod+F6 exec gparted
bindsym $mod+F11 exec snapper-tools
bindsym $mod+F12 exec qalculate-qt

bindsym $mod+Shift+d exec "killall -9 dunst; dunst -b; notify-send 'Dunst restarted';"
bindsym Print exec --no-startup-id i3-scrot
bindsym $mod+Print --release exec --no-startup-id i3-scrot -w
bindsym $mod+Shift+Print --release exec --no-startup-id i3-scrot -s
bindsym $mod+$alt+h exec xdg-open /usr/share/doc/manjaro/i3_help.pdf
bindsym $mod+Ctrl+x --release exec --no-startup-id xkill

