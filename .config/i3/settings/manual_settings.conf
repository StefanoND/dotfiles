# Set mod key (Mod1=<Alt>, Mod4=<Super>)
set $mod Mod4
set $alt Mod1

focus_follows_mouse yes
# Disable acceleration
exec_always for id in $(xinput list | grep "pointer" | cut -d '=' -f 2 | cut -f 1); do xinput --set-prop $id 'libinput Accel Profile Enabled' 0, 1; done

# set default desktop layout (default is tiling)
# workspace_layout tabbed <stacking|tabbed>

# Font for window titles. Will also be used by the bar unless a different font
# is used in the bar {} block below.
font xft:Inter 11

# Use Mouse+$mod to drag floating windows
floating_modifier $mod

# Avoid forcing tiling mode since some apps that have dropdown, popup, etc menus will have problems
#
# Open specific applications in floating mode
for_window [title="alsamixer"] floating enable
for_window [class="calamares"] floating enable
for_window [class="Clipgrab"] floating enable
