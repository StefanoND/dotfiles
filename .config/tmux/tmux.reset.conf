# First remove *all* keybindings
# unbind-key -a
# Now reinsert all the regular tmux keys
bind ^X lock-server
bind ^C new-window -c "$HOME"
bind ^D detach
bind * list-clients

bind M-H previous-window # Move to next window with Alt-Shift-H
bind M-L next-window     # Move to next window with Alt-Shift-L

bind r command-prompt "rename-window %%"
bind R source-file ~/dotfiles/.config/tmux/tmux.conf \; display "Tmux Reloaded"
bind ^A last-window
bind ^W list-windows
bind w list-windows
bind z resize-pane -Z   # Maximize pane
bind ^L refresh-client
bind l refresh-client
bind | split-window

# Split Panes
bind v split-window -v -c "#{pane_current_path}" # Split Vertically
bind s split-window -h -c "#{pane_current_path}" # Split Horizontally

bind '"' choose-window

bind M-h select-pane -L # Select Pane Left
bind M-j select-pane -D # Select Pane Down
bind M-k select-pane -U # Select Pane Up
bind M-l select-pane -R # Select Pane Right

bind -r -T prefix h resize-pane -L 20 # Resize Pane Left
bind -r -T prefix j resize-pane -D 7  # Resize Pane Down
bind -r -T prefix k resize-pane -U 7  # Resize Pane Up
bind -r -T prefix l resize-pane -R 20 # Resize Pane Right

bind : command-prompt
bind * setw synchronize-panes
bind P set pane-border-status
bind c kill-pane
bind x swap-pane -D
bind S choose-session
# bind-key -n C-M-n display-popup -E nvim -c ":ObsidianNew"
# bind-key -n C-M-q display-popup -w "90%" -h "85%" -E nvim -c ":ObsidianSearch"

# Copy Mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

unbind -T copy-mode-vi MouseDragEnd1Pane
