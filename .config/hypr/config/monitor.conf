# ┃                     Monitor Configuration                   ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Monitor wiki https://wiki.hyprland.org/0.45.0/Configuring/Monitors/

# monitor = , preferred, auto, 1

# # These are without isolating second GPU
# monitor = HDMI-A-2,1920x1080@50,0x0,1
# monitor = DP-4,1920x1080@144,1920x0,1
# monitor = DVI-D-2,1920x1080@50,3840x0,1
# monitor = DP-3,disable

# These are with an isolated second GPU
monitor = HDMI-A-1,1920x1080@60,0x-380,1, transform, 1
# monitor = DP-1,1920x1080@144,1920x0,1
monitor = DP-1,1920x1080@120,1080x0,1
# monitor = DVI-D-1,1920x1080@50,3840x0,1
monitor = HDMI-A-2,1920x1080@60,3000x0,1

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1

workspace = 4, monitor:DP-1
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-1

workspace = 7, monitor:HDMI-A-2
workspace = 8, monitor:HDMI-A-2
workspace = 9, monitor:HDMI-A-2
# workspace = 7, monitor:DVI-D-1
# workspace = 8, monitor:DVI-D-1
# workspace = 9, monitor:DVI-D-1

# If you need to scale things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
#xwayland {
#  force_zero_scaling = true       # Unscale XWayland
#}

#env = GDK_SCALE, 1.25                   # GDK Scaling Factor
