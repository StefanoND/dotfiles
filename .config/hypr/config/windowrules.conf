# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/0.45.0/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = float, Rofi
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol)
windowrulev2 = float, class:^()$,title:^(Picture in picture)$
windowrulev2 = float, class:^()$,title:^(Save File)$
windowrulev2 = float, class:^()$,title:^(Open File)$
windowrulev2 = float, class:^(LibreWolf)$,title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrulev2 = float, class:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrulev2 = float, class:^(CachyOSHello)$
windowrulev2 = float, class:^(zenity)$
windowrulev2 = float, class:^()$,title:^(Steam - Self Updater)$
# Increase the opacity
windowrulev2 = opacity 0.92, class:^(thunar|nemo)$
windowrulev2 = opacity 0.96, class:^(discord|armcord|webcord|vesktop)$
windowrulev2 = opacity 0.95, title:^(QQ|Telegram)$
windowrulev2 = opacity 0.95, title:^(NetEase Cloud Music Gtk4)$
# General window rules
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = size 960 540, title:^(Picture-in-Picture)$
windowrulev2 = move 25%-, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrulev2 = move 25%-, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrulev2 = size 960 540, title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrulev2 = pin, title:^(danmufloat)$
windowrulev2 = rounding 6, title:^(danmufloat|termfloat)$
windowrulev2 = animation slide right, class:^(kitty|Alacritty)$
windowrulev2 = tile, class:^(kitty|Alacritty)$
windowrulev2 = center, class:^(kitty|Alacritty)$
windowrulev2 = noblur, class:^(org.mozilla.firefox)$
windowrulev2 = noblur, class:^(Brave-browser|brave)$

# Special Workspaces
windowrulev2 = animation slide right, class:^(kitty_term)$
windowrulev2 = float, class:^(kitty_term)$
# windowrulev2 = tile, class:^(kitty_term)$
windowrulev2 = center, class:^(kitty_term)$
# windowrulev2 = size 1896 1024, class:^(kitty_term)$
windowrulev2 = size 1906 1066, class:^(kitty_term)$
# windowrulev2 = move 12 43, class:^(kitty_term)$
windowrulev2 = move 7 7, class:^(kitty_term)$
windowrulev2 = rounding 6, class:^(kitty_term)$
windowrulev2 = bordersize 4, class:^(kitty_term)$
workspace = special:kitty_term, on-created-empty:$terminal
workspace = name:kitty_term, gapsout:9, gapsin:7

windowrulev2 = animationslide right, class:^(spotify_player)$
windowrulev2 = float, class:^(spotify_player)$
windowrulev2 = center, class:^(spotify_player)$
# windowrulev2 = size 1896 1024, class:^(spotify_player)$
windowrulev2 = size 1906 1066, class:^(spotify_player)$
# windowrulev2 = move 12 43, class:^(spotify_player)$
windowrulev2 = move 7 7, class:^(spotify_player)$
windowrulev2 = rounding 6, class:^(spotify_player)$
windowrulev2 = bordersize 4, class:^(spotify_player)$
workspace = special:spotify_player, on-created-empty:$player
workspace = name:spotify_player, gapsout:9, gapsin:7

windowrulev2 = animation slide right, class:^(com.rtosta.zapzap)$
windowrulev2 = float, class:^(com.rtosta.zapzap)$
windowrulev2 = center, class:^(com.rtosta.zapzap)$
# windowrulev2 = size 1896 1024, class:^(com.rtosta.zapzap)$
windowrulev2 = size 1906 1066, class:^(com.rtosta.zapzap)$
# windowrulev2 = move 12 43, class:^(com.rtosta.zapzap)$
windowrulev2 = move 7 7, class:^(com.rtosta.zapzap)$
windowrulev2 = rounding 6, class:^(com.rtosta.zapzap)$
windowrulev2 = bordersize 4, class:^(com.rtosta.zapzap)$
workspace = special:zapzap, on-created-empty:$zapzap
workspace = name:zapzap, gapsout:9, gapsin:7

# Decorations related to floating windows on workspaces 1 to 9
windowrulev2 = bordersize 4, floating:1, onworkspace:w[fv1-9]
windowrulev2 = bordercolor $mauve, floating:1, onworkspace:w[fv1-9]
windowrulev2 = rounding 6, floating:1, onworkspace:w[fv1-9]

# Decorations related to tiling windows on workspaces 1 to 9
windowrulev2 = bordersize 4, floating:0, onworkspace:f[1-9]
windowrulev2 = rounding 6, floating:0, onworkspace:f[1-9]
# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/ #
workspace = 1, default:true, monitor:$priMon
workspace = 4, default:true, monitor:$secMon
workspace = 7, default:true, monitor:$thiMon

# Workspace selectors https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#workspace-selectors
workspace = r[1-3], monitor:$priMon
workspace = r[4-6], monitor:$secMon
workspace = r[7-9], monitor:$thiMon
workspace = special:scratchpad, on-created-empty:$applauncher

# no_gaps_when_only deprecated instead workspaces rules with selectors can do the same
# Smart gaps from 0.45.0 https://wiki.hyprland.org/0.45.0/Configuring/Workspace-Rules/#smart-gaps
workspace = w[tv1-9], gapsout:9, gapsin:7
workspace = f[1], gapsout:9, gapsin:7
# Workspaces Rules End #

# Layers Rules #
layerrule = animation slide top, logout_dialog
layerrule = animation popin 50%, waybar
layerrule = animation slide down, waybar
layerrule = animation fade 50%, wallpaper
# Layers Rules End #
