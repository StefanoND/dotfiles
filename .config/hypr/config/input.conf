# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Input wiki https://wiki.hyprland.org/0.45.0/Configuring/Variables/#input
input {
    kb_layout = pt
    kb_variant = 
    kb_model = pc105
    kb_options = 
    numlock_by_default = false
    mouse_refocus = false
    repeat_rate = 60
    repeat_delay = 300

    follow_mouse = 1 # 0|1|2|3
    float_switch_override_focus = 2

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
    
    accel_profile = flat
    sensitivity = 0
}
