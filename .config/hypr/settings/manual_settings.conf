# Bindings

bind = $mainMod, SUPER_L, exec, nwg-drawer -mb 10 -mr 10 -ml 10 -mt 10

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
# Reaload waybar
bind = $mainMod, w, exec, ~/.config/hypr/brain/scripts/waybar_restart.sh

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod SHIFT, R, exec, hyprctl reload
# bind = $mainMod, 36, exec, footclient
# bind = $mainMod, T, exec, footclient
bind = $mainMod, Q, killactive,
# bind = $mainMod SHIFT, E, exec, nwgbar
bind = $mainMod, 0, exec, nwgbar
# bind = $mainMod, N, exec, thunar
bind = $mainMod, T, exec, QT_QPA_PLATFORMTHEME=qt5ct dolphin
bind = $mainMod, 65, togglefloating,
bind = $mainMod, D, exec, wofi --normal-window --show drun --allow-images
# bind = $mainMod SHIFT, D, exec, nwg-drawer -mb 10 -mr 10 -ml 10 -mt 10
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, P, togglesplit, # dwindle

# Mainmod + Function keys
bind = $mainMod, F1, exec, firedragon
# bind = $mainMod, F2, exec, thunderbird
# bind = $mainMod, F3, exec, thunar
bind = $mainMod, F3, exec, QT_QPA_PLATFORMTHEME=qt5ct;qt6ct dolphin
# bind = $mainMod, F4, exec, geany
bind = $mainMod, F4, exec, QT_QPA_PLATFORMTHEME=qt5ct;qt6t kate
# bind = $mainMod, F5, exec, github-desktop
bind = $mainMod, F5, exec, flatpak run io.github.shiftey.Desktop
bind = $mainMod, F6, exec, gparted
# bind = $mainMod, F7, exec, inkscape
bind = $mainMod, F7, exec, flatpak run org.inkscape.Inkscape
# bind = $mainMod, F8, exec, blender
bind = $mainMod, F8, exec, flatpak run org.blender.Blender
# bind = $mainMod, F9, exec, meld
# bind = $mainMod, F10, exec, joplin-desktop
bind = $mainMod, F10, exec, flatpak run md.obsidian.Obsidian
bind = $mainMod, F11, exec, snapper-tools
# bind = $mainMod, F12, exec, galculator
bind = $mainMod, F12, exec, flatpak run io.github.Qalculate.qalculate-qt
bind = $mainMod, N, exec, makoctl menu wofi -d -p 'Choose Action: '

# Personal bindings
bind = $mainMod, RETURN, exec, hdrop kitty
bind = $mainMod+SHIFT, RETURN, exec, hdrop emacsclient -r -s doom -a doom
bind = $mainMod+ALT, RETURN, exec, hdrop emacsclient -r -s stemacs -a stemacs

bind = $mainMod+SHIFT, F, exec, firedragon -P
# bind = $mainMod+SHIFT, M, exec, flatpak run com.spotify.Client --command="spotify --enable-features=UseOzonePlatform --ozone-platform=wayland"
bind = $mainMod+SHIFT, M, exec, flatpak run com.spotify.Client --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod+SHIFT, W, exec, flatpak run com.github.eneshecan.WhatsAppForLinux
bind = $mainMod+SHIFT, G, exec, godot
bind = $mainMod+SHIFT, V, exec, virt-manager
bind = $mainMod+ALT, H, exec, flatpak run com.unity.UnityHub
bind = $mainMod+ALT, S, exec, flatpak run com.valvesoftware.Steam
# bind = $mainMod+ALT, D, exec, flatpak run com.discordapp.Discord
# bind = $mainMod+ALT, D, exec, flatpak run com.discordapp.Discord --enable-features=UseOzonePlatform --ozone-platform=wayland
bind = $mainMod+SHIFT, D, exec, flatpak run dev.vencord.Vesktop
# bind = $mainMod+ALT, L, exec, flatpak run net.lutris.Lutris
bind = $mainMod+ALT, L, exec, flatpak run net.lutris.Lutris
# bind = $mainMod+ALT, C, exec, codium

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, H, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, L, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, K, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [1-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move to workspace with focused container with ALT + SHIFT + [1-9]
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9

# Move active window to a workspace with mainMod + SHIFT + [1-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9

workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1, default:true
workspace = 3, monitor:HDMI-A-1, default:true
workspace = 4, monitor:DP-3, default:true
workspace = 5, monitor:DP-3, default:true
workspace = 6, monitor:DP-3, default:true
workspace = 7, monitor:DP-2, default:true
workspace = 8, monitor:DP-2, default:true
workspace = 9, monitor:DP-2, default:true

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# set volume (laptops only and may or may not work on PCs)
# bind = ,122, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = ,122, exec, pactl set-sink-volume @DEFAULT_SINK@ -5% | sed -En 's/.*\[([1-9]+)%\].*/\1/p' | head -1 > $WOBSOCK
bind = ,123, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ,121, exec, pactl set-sink-volume @DEFAULT_SINK@ 0%

#other bindings
# bind = $mainMod, O, exec, firedragon
bind =,Print,exec,grim
bind = $mainMod, F, fullscreen
bind = $mainMod ALT, F, fakefullscreen
bind = ,232,exec,brightnessctl -c backlight set 5%-
bind = ,233,exec,brightnessctl -c backlight set +5%

# for resizing window
# will switch to a submap called resize
bind=$mainMod,R,submap,resize

# for resizing window
# will start a submap called "resize"
submap=resize

# sets repeatable binds for resizing the active window
bind=,right,resizeactive,50 0
bind=,L,resizeactive,50 0
bind=,left,resizeactive,-50 0
bind=,H,resizeactive,-50 0
bind=,up,resizeactive,0 -50
bind=,K,resizeactive,0 -50
bind=,down,resizeactive,0 50
bind=,J,resizeactive,0 50

# use reset to go back to the global submap
bind=,escape,submap,reset

# will reset the submap, meaning end the current one and return to the global one
submap=reset

# to move window
bind = $mainMod SHIFT,up, movewindow, u
bind = $mainMod SHIFT,K, movewindow, u
bind = $mainMod SHIFT,down, movewindow, d
bind = $mainMod SHIFT,J, movewindow, d
bind = $mainMod SHIFT,left, movewindow, l
bind = $mainMod SHIFT,H, movewindow, l
bind = $mainMod SHIFT,right, movewindow, r
bind = $mainMod SHIFT,L, movewindow, r

#video play paues bindings
bind=,172,exec,playerctl play-pause
bind=,171,exec,playerctl next
bind=,173,exec,playerctl previous

#screenshot
# Snip a selection and pipe to swappy
#bind = ,Print, exec, grim -g "$(slurp)" - | swappy -f -
# Screenshot a window and pipe to swappy
#bind = CTRL, Print, exec, .config/hypr/scripts/screenshot_window.sh
# Screenshot the current display and pipe to swappy
#bind = SHIFT, Print, exec, .config/hypr/scripts/screenshot_display.sh

