# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# ##################################################
# ##  _  __          _                         _  ##
# ## | |/ /___ _   _| |__   ___   __ _ _ __ __| | ##
# ## | ' // _ \ | | | '_ \ / _ \ / _` | '__/ _` | ##
# ## | . \  __/ |_| | |_) | (_) | (_| | | | (_| | ##
# ## |_|\_\___|\__, |_.__/ \___/ \__,_|_|  \__,_| ##
# ##           |___/                              ##
# ##################################################
# Keyboard

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pt
    kb_variant =
    kb_model = pc105
    kb_options =
    numlock_by_default = false
    mouse_refocus=false
    repeat_rate = 60
    repeat_delay = 300
    follow_mouse = 1

# ####################################################
# ##  _____                _                     _  ##
# ## |_   _|__  _   _  ___| |__  _ __   __ _  __| | ##
# ##   | |/ _ \| | | |/ __| '_ \| '_ \ / _` |/ _` | ##
# ##   | | (_) | |_| | (__| | | | |_) | (_| | (_| | ##
# ##   |_|\___/ \__,_|\___|_| |_| .__/ \__,_|\__,_| ##
# ##                            |_|                 ##
# ####################################################
# Touchpad

    touchpad {
      natural_scroll = true
      tap-to-click = true
      disable_while_typing = true
    }

    accel_profile = flat
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# #######################################
# ## _     _            _              ##
# ##| |__ | |_   _ _ __(_)_ __   __ _  ##
# ##| '_ \| | | | | '__| | '_ \ / _` | ##
# ##| |_) | | |_| | |  | | | | | (_| | ##
# ##|_.__/|_|\__,_|_|  |_|_| |_|\__, | ##
# ##                            |___/  ##
# #######################################
# Bluring

blurls = waybar
blurls = wofi
blurls = thunar
blurls = gedit
blurls = gtk-layer-shell # for nwg-drawer
blurls = catfish

# ##########################################
# ##                         _ _          ##
# ##   ___  _ __   __ _  ___(_) |_ _   _  ##
# ##  / _ \| '_ \ / _` |/ __| | __| | | | ##
# ## | (_) | |_) | (_| | (__| | |_| |_| | ##
# ##  \___/| .__/ \__,_|\___|_|\__|\__, | ##
# ##       |_|                     |___/  ##
# ##########################################
# Opacity

windowrule = opacity 0.85 override 0.85 override,^(thunar)$
windowrule = opacity 0.85 override 0.85 override,^(dolphin)$
windowrule = opacity 0.85 override 0.85 override,^(gedit)$
windowrule = opacity 0.85 override 0.85 override,^(kate)$
windowrule = opacity 0.85 override 0.85 override,^(catfish)$

# ###########################################
# ##   __ _             _   _              ##
# ##  / _| | ___   __ _| |_(_)_ __   __ _  ##
# ## | |_| |/ _ \ / _` | __| | '_ \ / _` | ##
# ## |  _| | (_) | (_| | |_| | | | | (_| | ##
# ## |_| |_|\___/ \__,_|\__|_|_| |_|\__, | ##
# ##                                |___/  ##
# ###########################################
# Floating

# Avoid forcing tiling mode since some apps that have dropdown, popup, etc menus will have problems

#window rules with evaluation
windowrulev2 = opacity 0.85 0.85,floating:1
windowrulev2 = float, title:^(alsamixer)$
windowrulev2 = float, class:^(Clipgrab)$
windowrulev2 = float, title:^(File Transfer*)$
windowrulev2 = float, class:^(bauh)$
windowrulev2 = float, class:^(Galculator)$
windowrulev2 = float, class:^(GParted)$
windowrulev2 = float, class:^(Lightdm-settings)$
windowrulev2 = float, class:^(Garuda)(.*)$
windowrulev2 = float, class:^(garuda)(.*)$
windowrulev2 = float, title:^(MuseScore: Play Panel)$
windowrulev2 = float, class:^(azote)$
windowrulev2 = float, class:^(Oblogout)$
windowrulev2 = float, class:^(octopi)$
windowrulev2 = float, title:^(About Pale Moon)$
windowrulev2 = float, class:^(Pamac-manager)$
windowrulev2 = float, class:^(Pamac-updater)$
windowrulev2 = float, class:^(Pavucontrol)$
windowrulev2 = float, class:^(Qtconfig-qt4)$
windowrulev2 = float, class:^(qt5ct)$
windowrulev2 = float, title:^(sudo)$
windowrulev2 = float, class:^(Simple-scan)$
windowrulev2 = float, class:^((?i)System-config-printer.py)$
windowrulev2 = float, class:^(Skype)$
windowrulev2 = float, class:^(Timeshift-gtk)$
windowrulev2 = float, class:^((?i)virtualbox)$
windowrulev2 = float, class:^(Xfburn)$
windowrulev2 = float, class:^(keepassxc)$

# Open specific applications in X workspace
windowrulev2 = workspace 3, class:^(Spotify)$
windowrulev2 = workspace 3, title:^(Spotify.*)$
windowrulev2 = workspace 3, class:^(whatsapp-for-linux)$

# Workaround to enable screensharing to hide the main window
windowrulev2 = opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrulev2 = noanim,class:^(xwaylandvideobridge)$
windowrulev2 = noinitialfocus,class:^(xwaylandvideobridge)$
windowrulev2 = maxsize 1 1,class:^(xwaylandvideobridge)$
windowrulev2 = noblur,class:^(xwaylandvideobridge)$

# ###########################################
# ##   __                               _  ##
# ##  / _| ___   ___ _   _ ___  ___  __| | ##
# ## | |_ / _ \ / __| | | / __|/ _ \/ _` | ##
# ## |  _| (_) | (__| |_| \__ \  __/ (_| | ##
# ## |_|  \___/ \___|\__,_|___/\___|\__,_| ##
# ###########################################
# Focused

windowrule = stayfocused, ^(wofi)$

# #########################################################
# ##  _____ _                           _           _    ##
# ## |  ___| | __ _ _ __ ___   ___  ___| |__   ___ | |_  ##
# ## | |_  | |/ _` | '_ ` _ \ / _ \/ __| '_ \ / _ \| __| ##
# ## |  _| | | (_| | | | | | |  __/\__ \ | | | (_) | |_  ##
# ## |_|   |_|\__,_|_| |_| |_|\___||___/_| |_|\___/ \__| ##
# #########################################################
# Flameshot

# # if someone wants it by heart
# but you can edit the picture with all the features
# in gweenview(KDE image viewer) just same as flameshot
windowrulev2=move 0 0,title:^(flameshot)
#windowrulev2=nofullscreenrequest,title:^(flameshot)

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Example windowrule v1
windowrule = float, ^(garuda-assistant)$
windowrule = float, ^(garuda-boot-options)$
windowrule = float, ^(garuda-boot-repair)$
windowrule = float, ^(garuda-gamer)$
windowrule = float, ^(garuda-network-assistant)$
windowrule = float, ^(garuda-settings-manager)$
windowrule = float, ^(garuda-welcome)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = suppressevent maximize, class:.* # You'll probably like this.

# #########################################################
# ##     _          _                 _   _              ##
# ##    / \   _ __ (_)_ __ ___   __ _| |_(_) ___  _ __   ##
# ##   / _ \ | '_ \| | '_ ` _ \ / _` | __| |/ _ \| '_ \  ##
# ##  / ___ \| | | | | | | | | | (_| | |_| | (_) | | | | ##
# ## /_/   \_\_| |_|_|_| |_| |_|\__,_|\__|_|\___/|_| |_| ##
# #########################################################
# Animation

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    # new_is_master = true # Deprecated
    new_status = master
}

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = on
}

