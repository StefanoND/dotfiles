# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

source=~/dotfiles/.config/hypr/themes/mocha.conf

# Gtk Theme workaround
exec = gsettings set org.gnome.desktop.interface gtk-theme 'Catppuccin-Mocha-Standard-Mauve-Dark'
exec = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec = gsettings set org.gnome.desktop.interface font-name 'FiraCode Nerd Font Mono'
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Catppuccin-Mocha-Mauve-Cursors'
exec = hyprctl setcursor Catppuccin-Mocha-Mauve-Cursors 48

# Use gtk-settings
exec-once = apply-gsettings

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME,Catppuccin-Mocha-Mauve-Cursors
env = XCURSOR_SIZE,48
env = HYPRCURSOR_SIZE,48

env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = LIBVA_DRIVER_NAME,nvidia
# env = XDG_SESSION_TYPE,wayland # Enabled in garuda by default
env = GBM_BACKEND,nvidia-drm

env = NVD_BACKEND,direct # VA-API Hardware Acceleration
env = ELECTRON_OZONE_PLATFORM_HINT,auto # Fixes flickering in Electron/CEF Apps

env = QT_STYLE_OVERRIDE,kvantum
env = QT_QPA_PLATFORMTHEME,qt5ct:qt6ct
# env = MOZ_ENABLE_WAYLAND,1 # Enabled in garuda by default

#executions which i am not certainly sure that will work for every one yeah they are also not that much important but if work then setup will become great!!
exec-once = mako
exec-once =/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# exec-once = foot --server
# experimental(might work might won't)

# pre executions (under development)
exec-once = exec xrdb -load ~/.Xresources
# exec-once = blueman-tray

# Clipboard Manager
exec-once = wl-paste --type text --watch cliphist store #Stores only text data
exec-once = wl-paste --type image --watch cliphist store #Stores only image data
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

exec-once = /usr/bin/emacs --init-directory="~/dotfiles/emacs/doom/doomemacs" --bg-daemon="doom"
exec-once = /usr/bin/emacs --init-directory="~/dotfiles/emacs/stemacs/stemacs" --bg-daemon="stemacs"
exec-once = syncthing &

exec-once = vboxheadless -s WoSEE &
exec-once = flatpak run net.lutris.Lutris &
exec-once = python3 ~/dotfiles/apps/headset-charge-indicator/headset-charge-indicator.py &

exec-once = otd-daemon &

# Please note not all available settings / options are set here.
# For a full list, see the wiki

autogenerated = 0 # remove this line to remove the warning

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=HDMI-A-1, 1920x1080@60.00000, 0x0, 1.00
monitor=DP-3, 1920x1080@144.00000, 1920x0, 1.00
monitor=DP-2, 1920x1080@60.00000, 3840x0, 1.00

# Execute your favorite apps at launch
# exec-once = garuda-welcome

# Add networkmanager applet to tray in waybar
exec-once = nm-applet --indicator
exec-once = blueman-tray

# Set keyboard layout
#exec-once = .local/bin/garuda-locale.sh

# Set monitor values. For own values, please comment with #
#exec-once = .local/bin/mon.sh

# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pt
    kb_variant =
    kb_model = pc105
    kb_options =
    numlock_by_default = false
    mouse_refocus=false
    repeat_rate = 60
    repeat_delay = 300
    follow_mouse = 1

    touchpad {
      natural_scroll = true
      tap-to-click = true
      disable_while_typing = true
    }

    accel_profile = flat
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# Refer to https://wiki.hyprland.org/Configuring/Variables/
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 1
    gaps_out = 3
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $mauve
    col.inactive_border = $lavender

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 8

    # Change transparency of focused and unfocused windows
    active_opacity = 1.00
    inactive_opacity = 0.75

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 1
        noise = 0.1
        new_optimizations = true

        vibrancy = 0.1696
    }

    drop_shadow = false
    # shadow_range = 4
    # shadow_render_power = 3
    # col.shadow = rgba(1a1a1aee)
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.5, 0.1, 1.05

    animation = windows, 1, 3, myBezier
    animation = windowsOut, 1, 3, default, popin 80%
    animation = border, 1, 6, default
    animation = borderangle, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 2, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_is_master = true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = 2.4g-mouse
    sensitivity = 0
}

device {
  name = sino-wealth-mechanical-keyboard
  repeat_rate = 60
  repeat_delay = 300
}

device {
  name = sino-wealth-mechanical-keyboard-2
  repeat_rate = 60
  repeat_delay = 300
}

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
windowrule = float, ^(garuda-assistant)$
windowrule = float, ^(garuda-boot-options)$
windowrule = float, ^(garuda-boot-repair)$
windowrule = float, ^(garuda-gamer)$
windowrule = float, ^(garuda-network-assistant)$
windowrule = float, ^(garuda-settings-manager)$
windowrule = float, ^(garuda-welcome)$
windowrule = float, ^(calamares)$

# Open specific applications in floating mode
windowrulev2 = float, title:^(alsamixer)$
windowrulev2 = float, class:^(Clipgrab)$
windowrulev2 = float, title:^(File Transfer*)$
windowrulev2 = float, class:^(bauh)$
windowrulev2 = float, class:^(Galculator)$
windowrulev2 = float, class:^(GParted)$
windowrulev2 = float, class:^(Lightdm-settings)$
windowrulev2 = float, class:^(Garuda)(.*)$
windowrulev2 = float, class:^(garuda)(.*)$
windowrulev2 = float, title:^(MuseScore: Play Panel)$
windowrulev2 = float, class:^(azote)$
windowrulev2 = float, class:^(Oblogout)$
windowrulev2 = float, class:^(octopi)$
windowrulev2 = float, title:^(About Pale Moon)$
windowrulev2 = float, class:^(Pamac-manager)$
windowrulev2 = float, class:^(Pamac-updater)$
windowrulev2 = float, class:^(Pavucontrol)$
windowrulev2 = float, class:^(Qtconfig-qt4)$
windowrulev2 = float, class:^(qt5ct)$
windowrulev2 = float, title:^(sudo)$
windowrulev2 = float, class:^(Simple-scan)$
windowrulev2 = float, class:^((?i)System-config-printer.py)$
windowrulev2 = float, class:^(Skype)$
windowrulev2 = float, class:^(Timeshift-gtk)$
