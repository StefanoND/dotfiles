; font-0 = JetBrainsMono Nerd Font Mono:size=12;3
; font-1 = JetBrainsMono Nerd Font Mono:size=22;5
; font-2 = JetBrainsMono Nerd Font Mono:size=16;4
; font-3 = JetBrainsMono Nerd Font Mono;3
; font-4 = JetBrainsMono Nerd Font Mono:size=30;7
;
; modules-left = left xworkspaces spacerbg xwindow spacerbg spotify right
; modules-center = left xkeyboard updates date weather right
; modules-right = left backlight spacerbg cpu spacerbg memory spacerbg eth spacerbg battery spacerbg pulseaudio spacerbg dunst right
;
; ;cursor-click = pointer
;
; [module/spacerbg]
; type = custom/text
;
; format = <label>
; format-background = ${colors.background}
; format-padding = 2pt
; label = " "
;
; [module/left]
; type = custom/text
;
; format = <label>
; format-foreground = ${colors.background}
; label = ""
; label-font = 3
;
; [module/right]
; type = custom/text
;
; format = <label>
; format-foreground = ${colors.background}
; label = ""
; label-font = 3
;
; [module/backlight]
; type = internal/backlight
;
; [module/battery]
; type = internal/battery
; low-at = 15
;
; [module/xworkspaces]
; type = internal/xworkspaces
; reverse-scroll = true
; format = <label-state>
;
; label-active =  %name%
; label-occupied = 󰺕 %name%
; label-urgent =  %name%
; label-empty =  %name%
;
; label-active-font = 1
; label-active-padding = 3pt
; label-active-background = ${colors.background}
;
; label-occupied-font = 1
; label-occupied-padding = 3pt
; label-occupied-background = ${colors.background}
;
; label-urgent-font = 1
; label-urgent-padding = 3pt
; label-urgent-background = ${colors.background}
;
; label-empty-font = 1
; label-empty-padding = 3pt
; label-empty-background = ${colors.background}
;
; [module/systray]
; type = internal/tray
; format-background = ${colors.background}
; format-foreground = ${colors.foreground}
; ; format-margin = 8pt
;
; tray-spacing = 16pt
; tray-background = ${colors.background}
;
; [module/xwindow]
; type = internal/xwindow
; format = <label>
; format-background = ${colors.background}
; format-foreground = ${colors.foreground}
; label = %title:0:60:...%
; label-maxlen = 26
;
; [module/pulseaudio]
; type = internal/pulseaudio
;
; format-volume-prefix = " "
; format-volume-prefix-foreground = ${colors.foreground}
; format-volume-font = 2
; format-volume = <label-volume>
; format-volume-background = ${colors.background}
;
; label-volume = %percentage%%
;
; label-muted = ""
; label-muted-font = 2
; label-muted-foreground = ${colors.foreground}
; label-muted-background = ${colors.background}
;
; [module/memory]
; type = internal/memory
; interval = 3
; format-prefix = " "
; format-prefix-foreground = ${colors.primary}
; format-background = ${colors.background}
; label = %percentage_used%%
;
; [module/cpu]
; type = internal/cpu
; interval = 3
; format-prefix = " "
; format-font = 3
; format-prefix-foreground = ${colors.primary}
; format-background = ${colors.background}
; label = %percentage%%
; click-left = kitty htop
;
; [module/date]
; type = internal/date
; interval = 1
;
; date = %H:%M:%S | %a %d/%b/%Y
;
; label = %date%
; label-foreground = ${colors.foreground}
; label-background = ${colors.background}
;
; [module/xkeyboard]
; type = custom/script
; exec = echo "󰌌"
; format-padding = 1
; format-font = 3
; format-foreground = ${colors.foreground}
; format-background = ${colors.background}
;
; [module/getupdates]
; type = custom/script
; interval = 7200
; exec = ~/dotfiles/.config/polybar/scripts/check_updates.sh
; format = ""
;
; [module/updates]
; type = custom/script
; exec = cat ~/updatecheck
; interval = 10
; format-padding = 1
; format-foreground = ${colors.foreground}
; format-background = ${colors.background}
;
; [module/getweather]
; type = custom/script
; interval = 3600
; exec = ~/dotfiles/.config/polybar/scripts/weather.sh | tee ~/weathercheck
; format = ""
;
; [module/weather]
; type = custom/script
; exec = cat ~/weathercheck
; tail = false
; interval = 10
; format-padding = 1
; format-foreground = ${colors.foreground}
; format-background = ${colors.background}
;
; [module/spotify]
; type = custom/script
; interval = 1
; format-prefix = " "
; format = <label>
; exec = /usr/bin/python ~/dotfiles/.config/polybar/scripts/mediaplayer.py -f '{artist} - {song}'
; format-underline = #1db954
; ;control players (optional)
; click-left = playerctl --player=spotify play-pause
; click-right = playerctl --player=spotify next
; click-middle = playerctl --player=spotify previous
; format-padding = 1
; format-foreground = ${colors.foreground}
; format-background = ${colors.background}
; label-maxlen = 26
;
; [network-base]
; type = internal/network
; interval = 2
; format-connected = <label-connected>
; format-disconnected = <label-disconnected>
; label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
;
; [module/eth]
; inherit = network-base
; interface-type = wired
; label-connected = UP: %downspeed% DOWN: %upspeed%
; label-connected-foreground = ${colors.primary}
; label-connected-background = ${colors.background}
;
; label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected
; label-disconnected-foreground = ${colors.primary}
; label-disconnected-background = ${colors.background}
;
; [module/dunst]
; type = custom/ipc
; initial = 1
; format-foreground = ${colors.yellow}
; format-background = ${colors.background}
; format-font = 3
;
; hook-0 = echo "%{A1:dunstctl set-paused true && polybar-msg hook dunst 2:}%{A}" &
; hook-1 = echo "%{A1:dunstctl set-paused false && polybar-msg hook dunst 1:}%{A}" &
;
; [settings]
; screenchange-reload = true
; pseudo-transparency = true
;
; ; vim:ft=dosini
